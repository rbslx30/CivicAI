<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | CivicAI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div></div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <main class="page-wrapper" style="justify-content: center; align-items: center; min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
      <div class="card-header" style="text-align: center; justify-content: center;">
        <h2 class="card-title">Create Account</h2>
      </div>
      <form id="signup-form" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="field-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="e.g. Ramesh Kumar" />
        </div>
        <div class="field-group">
          <label for="email">Email Address</label>
          <div style="display: flex; gap: 8px;">
            <input type="email" id="email" name="email" required placeholder="e.g. user@example.com" style="flex: 1;" />
            <button type="button" id="send-otp-btn" style="padding: 0 12px; background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; cursor: pointer; font-family: 'Sora', sans-serif; font-size: 13px; font-weight: 600; white-space: nowrap;">Send OTP</button>
          </div>
        </div>
        <div class="field-group" id="otp-group" style="display: none;">
          <label for="otp">Enter OTP</label>
          <input type="text" id="otp" name="otp" placeholder="6-digit code" />
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" />
        </div>
        <div class="field-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••" />
        </div>
        <div id="auth-error" class="form-error"></div>
        <button type="submit" class="btn-submit" id="signup-submit-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader" hidden>
            <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
            Creating...
          </span>
        </button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--violet-lt); text-decoration: none;">Sign In</a>
      </p>
    </div>
  </main>
  <script>
    const signupForm = document.getElementById('signup-form');
    const signupSubmitBtn = document.getElementById('signup-submit-btn');
    const signupBtnText = signupSubmitBtn.querySelector('.btn-text');
    const signupBtnLoader = signupSubmitBtn.querySelector('.btn-loader');
    const errorBox = document.getElementById('auth-error');

    function showLoading(isLoading) {
      signupBtnText.hidden = isLoading;
      signupBtnLoader.hidden = !isLoading;
      signupSubmitBtn.disabled = isLoading;
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    const sendOtpBtn = document.getElementById('send-otp-btn');
    const otpGroup = document.getElementById('otp-group');
    const otpInput = document.getElementById('otp');

    sendOtpBtn.addEventListener('click', async () => {
      const email = document.getElementById('email').value;
      if (!email || !email.includes('@')) {
        showError("Please enter a valid email address first.");
        return;
      }
      
      sendOtpBtn.textContent = 'Sending...';
      sendOtpBtn.disabled = true;
      clearError();

      try {
        const res = await fetch('https://civicai-1gu2.onrender.com/api/auth/send-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        
        if (data.success) {
          otpGroup.style.display = 'block';
          sendOtpBtn.textContent = 'Sent ✅';
          // Automatically focus OTP input
          otpInput.focus();
        } else {
          showError(data.message || "Failed to send OTP.");
          sendOtpBtn.textContent = 'Send OTP';
          sendOtpBtn.disabled = false;
        }
      } catch (err) {
        console.error("OTP error:", err);
        showError("Server connection failed.");
        sendOtpBtn.textContent = 'Send OTP';
        sendOtpBtn.disabled = false;
      }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();

      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const otp = otpInput.value;
      
      if (password !== confirmPassword) {
        showError("Passwords do not match.");
        return; // Stop submission if passwords don't match
      }

      if (otpGroup.style.display === 'block' && !otp) {
          showError("Please enter the OTP sent to your email.");
          return;
      }
      if (otpGroup.style.display !== 'block') {
          showError("Please verify your email with an OTP first.");
          return;
      }

      showLoading(true);

      try {
        // Step 1: Verify OTP
        const otpRes = await fetch('https://civicai-1gu2.onrender.com/api/auth/verify-otp', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, otp })
        });
        const otpData = await otpRes.json();
        
        if (!otpData.success) {
           showError(otpData.message || "Invalid or expired OTP.");
           showLoading(false);
           return;
        }

        // Step 2: Create Account
        const res = await fetch('https://civicai-1gu2.onrender.com/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = 'login.html';
          // Optionally show a success message before redirecting
        } else {
          showError(data.message || "Signup failed.");
        }
      } catch (err) {
        console.error("Signup error:", err);
        showError("Server connection failed. Please try again.");
      }
      showLoading(false);
    });
  </script>
</body>
</html>
