<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | CivicAI</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true"><div class="orb orb-1"></div></div>
  <div class="grid-overlay" aria-hidden="true"></div>
  <main class="page-wrapper" style="justify-content: center; align-items: center; min-height: 100vh;">
    <div class="card" style="width: 100%; max-width: 400px;">
      <div class="card-header" style="text-align: center; justify-content: center;">
        <h2 class="card-title">Create Account</h2>
      </div>
      <form id="signup-form" method="POST" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="field-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required placeholder="e.g. Ramesh Kumar" />
        </div>
        <div class="field-group">
          <label for="email_mobile">Email or Mobile</label>
          <input type="text" id="email_mobile" name="email_mobile" required placeholder="e.g. user@example.com or 9876543210" />
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required placeholder="••••••••" />
        </div>
        <div class="field-group">
          <label for="confirm_password">Confirm Password</label>
          <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••" />
        </div>
        <div id="auth-error" class="form-error"></div>
        <button type="submit" class="btn-submit" id="signup-submit-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-loader" hidden>
            <svg class="spin" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10" stroke-opacity=".25"/><path d="M12 2a10 10 0 0 1 10 10" stroke-linecap="round"/></svg>
            Creating...
          </span>
        </button>
      </form>
      <p style="text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-muted);">
        Already have an account? <a href="login.html" style="color: var(--violet-lt); text-decoration: none;">Sign In</a>
      </p>
    </div>
  </main>
  <script>
    const signupForm = document.getElementById('signup-form');
    const signupSubmitBtn = document.getElementById('signup-submit-btn');
    const signupBtnText = signupSubmitBtn.querySelector('.btn-text');
    const signupBtnLoader = signupSubmitBtn.querySelector('.btn-loader');
    const errorBox = document.getElementById('auth-error');

    function showLoading(isLoading) {
      signupBtnText.hidden = isLoading;
      signupBtnLoader.hidden = !isLoading;
      signupSubmitBtn.disabled = isLoading;
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.classList.add('visible');
    }

    function clearError() {
      errorBox.textContent = '';
      errorBox.classList.remove('visible');
    }

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError();
      showLoading(true);

      const name = document.getElementById('name').value;
      const emailMobile = document.getElementById('email_mobile').value; // Get value from new ID
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value; // Get value from new input
      
      if (password !== confirmPassword) {
        showError("Passwords do not match.");
        showLoading(false);
        return; // Stop submission if passwords don't match
      }

      try {
        const res = await fetch('https://civicai-1gu2.onrender.com/api/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email: emailMobile, password }) // Use 'email' key for backend compatibility
        });
        const data = await res.json();
        if (data.success) {
          window.location.href = 'login.html';
          // Optionally show a success message before redirecting
        } else {
          showError(data.message || "Signup failed.");
        }
      } catch (err) {
        console.error("Signup error:", err);
        showError("Server connection failed. Please try again.");
      }
      showLoading(false);
    });
  </script>
</body>
</html>
