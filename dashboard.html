<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CivicAI</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

  <div class="dashboard-layout">
    
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">Civic<span>AI</span> Admin</div>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="active"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg> Dashboard</a>
        <a href="home.html" style="margin-top: auto; color: var(--red);"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg> Exit to Portal</a>
        
        <div style="padding: 12px 16px;">
          <select class="lang-selector" style="width: 100%;">
            <option value="en">English</option>
            <option value="hi">हिन्दी (Hindi)</option>
            <option value="bn">বাংলা (Bengali)</option>
            <option value="te">తెలుగు (Telugu)</option>
            <option value="mr">मराठी (Marathi)</option>
            <option value="ta">தமிழ் (Tamil)</option>
            <option value="ur">اردو (Urdu)</option>
            <option value="gu">ગુજરાતી (Gujarati)</option>
            <option value="kn">ಕన్నడ (Kannada)</option>
            <option value="ml">മലയാളം (Malayalam)</option>
            <option value="or">ଓଡ଼ିଆ (Odia)</option>
            <option value="pa">ਪੰਜਾਬੀ (Punjabi)</option>
            <option value="as">অসমীয়া (Assamese)</option>
            <option value="sa">संस्कृत (Sanskrit)</option>
            <option value="kok">कोंकणी (Konkani)</option>
            <option value="mai">मैथिली (Maithili)</option>
            <option value="ne">नेपाली (Nepali)</option>
            <option value="doi">डोगरी (Dogri)</option>
            <option value="ks">کأشُر (Kashmiri)</option>
            <option value="sat">ᱥᱟᱱᱛᱟᱲᱤ (Santhali)</option>
          </select>
        </div>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <header class="top-header">
        <div>
          <h1>Grievance Overview</h1>
          <p class="subtitle">Manage and track citizen complaints</p>
        </div>
        <div class="admin-profile">
          <div class="avatar">A</div>
          <span>System Admin</span>
        </div>
      </header>

      <!-- Stats Cards -->
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Complaints</h3>
          <div class="value" id="stat-total">0</div>
        </div>
        <div class="stat-card">
          <h3>Pending</h3>
          <div class="value text-yellow" id="stat-pending">0</div>
        </div>
        <div class="stat-card">
          <h3>Under Review</h3>
          <div class="value text-blue" id="stat-review">0</div>
        </div>
        <div class="stat-card">
          <h3>Resolved</h3>
          <div class="value text-green" id="stat-resolved">0</div>
        </div>
        <div class="stat-card">
          <h3>High Priority</h3>
          <div class="value text-red" id="stat-high">0</div>
        </div>
      </div>

      <!-- Controls (Search & Filter) -->
      <div class="controls-bar">
        <div class="search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Search Application No, Name, or Mobile...">
        </div>
        <select id="filter-status" class="filter-dropdown">
          <option value="All">All Statuses</option>
          <option value="Pending">Pending</option>
          <option value="Under Review">Under Review</option>
          <option value="Resolved">Resolved</option>
          <option value="High Priority">High Priority</option>
        </select>
        <select id="filter-dept" class="filter-dropdown">
          <option value="All">All Departments</option>
        </select>
      </div>

      <!-- Complaints Table -->
      <div class="table-container">
        <table id="complaints-table">
          <thead>
            <tr>
              <th>Application No</th>
              <th>Name</th>
              <th>Location</th>
              <th>Category</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Rows injected via JS -->
          </tbody>
        </table>
        <div id="no-data-msg" class="no-data" style="display: none;">No complaints found.</div>
      </div>
    </main>
  </div>

  <!-- Action Modal -->
  <div id="action-modal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Complaint Details</h2>
        <button id="close-modal" class="close-btn">&times;</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
  <script src="translations.js"></script>
</body>
</html>
